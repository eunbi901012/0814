services:
  database:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faculty_evaluation}
      POSTGRES_USER: ${POSTGRES_USER:-faculty_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faculty_app_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: faculty-evaluation-common-backend:0.0.1
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-faculty_evaluation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-faculty_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-faculty_app_password}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "8080:8080"

  frontend:
    image: faculty-evaluation-common-frontend:0.0.1
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3000:80"

volumes:
  postgres-data:
