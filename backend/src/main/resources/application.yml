spring:
  application:
    name: faculty-evaluation-common
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/faculty_evaluation}
    username: ${SPRING_DATASOURCE_USERNAME:faculty_app}
    password: ${SPRING_DATASOURCE_PASSWORD:faculty_app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: simple

server:
  port: 8080
