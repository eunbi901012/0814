openapi: 3.0.3
info:
  title: 교수업적평가시스템 공통기능 1차 API
  version: 0.1.0
servers:
- url: /api
security:
- sessionCookie: []
x-uncovered-requirements:
- canonical_id: REQ-044
  status: non-functional
  evidence: OpenAPI operation이 아니라 frontend의 React 18, TypeScript, Vite 5, nginx 정적 서빙 및 /api/* reverse proxy 기술스택 제약이다.
- canonical_id: REQ-045
  status: non-functional
  evidence: OpenAPI path가 아니라 infra/docker-compose.yml과 Flyway migration 산출물로 검증되는 인프라 구성 요구다.
- canonical_id: REQ-047
  status: non-functional
  evidence: HTTP operation이 아니라 AuthenticationPort, PersonnelInformationPort 뒤 Adapter 교체를 요구하는 아키텍처 경계다.
- canonical_id: REQ-058
  status: non-functional
  evidence: API 계약이 아니라 Docker Compose로 backend, frontend, database 서비스 실행 상태를 확인하는 런타임 검증이다.
- canonical_id: REQ-063
  status: non-functional
  evidence: 개별 endpoint가 아니라 동기 처리와 MyBatis 기반 blocking 영속성 선택을 고정하는 실행·영속성 결정이다.
