  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      x-related-requirements:
      - REQ-048
      - REQ-056
      - REQ-006
      - REQ-043
      - REQ-046
      - REQ-051
      - REQ-060
      - REQ-007
      - REQ-057
      - REQ-003
      - REQ-049
      - REQ-050
      x-business-rules:
      - 로그인 요청자는 R09 write 권한을 가져야 한다
      - 로그인 입력은 Requirement Registry REQ-048, REQ-056의 필수값과 불변 규칙을 만족해야 한다
      x-side-effects:
      - 로그인 결과를 관련 PostgreSQL table에 저장한다
      - 변경 전후 값, 처리자, 처리일시, 사유를 추적 가능한 구조에 남긴다
      x-state-transitions:
      - anonymous -> authenticated
      x-required-tests:
      - 'happy: R09 세션과 유효 입력 -> 로그인 후 후속 GET에서 변경값이 보인다'
      - 'auth: 세션 없는 요청 -> 401 ApiError가 반환되고 로그인 대상 데이터는 변경되지 않는다'
      - 'validation: 필수 식별자 누락 -> 400 ApiError와 해당 field error가 반환된다'
      - 'business: 로그인의 source-backed 불변/기간/권한 규칙 위반 -> 400 또는 409로 차단되고 기존 값이 유지된다'
      - 'side-effect: 로그인 성공 -> updated_at과 변경 추적 구조에 처리자/일시가 기록된다'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 필요
